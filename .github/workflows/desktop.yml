name: Java desktop builds
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - name: Build, test and package standalone app
        run: python build.py --test --package
      - name: Linux desktop integration
        if: runner.os == 'Linux'
        run: xvfb-run -a python build.py --ui-test
      - name: Archive native app with executable permissions
        shell: python
        run: |
          from pathlib import Path
          import platform, tarfile
          with tarfile.open('dist/PharmacyDemo-' + platform.system() + '-' + platform.machine() + '.tar.gz', 'w:gz') as archive:
              for entry in Path('build/native').iterdir():
                  archive.add(entry, arcname=entry.name)
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: PharmacyDemo-${{ runner.os }}-${{ runner.arch }}
          path: dist/
          if-no-files-found: error
